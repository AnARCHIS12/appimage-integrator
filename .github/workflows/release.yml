name: Release Aurémi

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  pages: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: false

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes appstream appstream-compose apt-utils createrepo-c dpkg-dev gnupg rpm xmlstarlet

      - name: Test
        run: make test

      - name: Build installers and native packages
        run: |
          make packages
          echo "AUREMI_VERSION=$(make --silent print-version)" >> "$GITHUB_ENV"

      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/v')
        run: test "$GITHUB_REF_NAME" = "v$(make --silent print-version)"

      - name: Import repository signing key
        env:
          AUREMI_GPG_PRIVATE_KEY: ${{ secrets.AUREMI_GPG_PRIVATE_KEY }}
        run: |
          set -eu
          test -n "$AUREMI_GPG_PRIVATE_KEY"
          export GNUPGHOME="$RUNNER_TEMP/auremi-gnupg"
          mkdir -m 700 "$GNUPGHOME"
          printf '%s' "$AUREMI_GPG_PRIVATE_KEY" | gpg --batch --import
          fingerprint=$(gpg --batch --with-colons --list-secret-keys | awk -F: '$1 == "fpr" { print $10; exit }')
          test "$fingerprint" = "96FFEB2C0E58A11010FE8543A684D249DCBB2E24"
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"
          echo "AUREMI_GPG_FINGERPRINT=$fingerprint" >> "$GITHUB_ENV"

      - name: Sign and verify RPM packages
        run: |
          set -eu
          for artifact in dist/Auremi-*.rpm; do
            rpmsign \
              --define "__gpg /usr/bin/gpg" \
              --define "_gpg_name $AUREMI_GPG_FINGERPRINT" \
              --define "_gpg_path $GNUPGHOME" \
              --addsign "$artifact"
          done
          rpmdb="$RUNNER_TEMP/rpmdb"
          mkdir -p "$rpmdb"
          rpm --dbpath "$rpmdb" --initdb
          rpm --dbpath "$rpmdb" --import packaging/auremi-signing-key.asc
          rpm --dbpath "$rpmdb" --checksig --verbose dist/Auremi-*.rpm | tee "$RUNNER_TEMP/rpm-signatures.txt"
          test "$(grep -c 'Signature, key ID 4250d249: OK' "$RUNNER_TEMP/rpm-signatures.txt")" -eq 2

      - name: Create checksums and signed repositories
        run: |
          make checksums-only
          ./packaging/build-repositories.sh "$AUREMI_VERSION" repository-site

      - name: Upload repository preview
        uses: actions/upload-artifact@v4
        with:
          name: auremi-signed-repository
          path: repository-site
          if-no-files-found: error

      - name: Configure GitHub Pages
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages repository
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-pages-artifact@v3
        with:
          path: repository-site

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign and verify release artifacts
        run: |
          set -eu
          identity="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${GITHUB_REF}"
          for artifact in \
            dist/appimage-integrator-linux-amd64 \
            dist/appimage-integrator-linux-arm64 \
            dist/Auremi-Installer-linux-amd64.tar.gz \
            dist/Auremi-Installer-linux-arm64.tar.gz \
            dist/Auremi-*.deb \
            dist/Auremi-*.rpm \
            dist/SHA256SUMS
          do
            cosign sign-blob "$artifact" --yes --bundle "${artifact}.sigstore.json"
            cosign verify-blob "$artifact" \
              --bundle "${artifact}.sigstore.json" \
              --certificate-identity "$identity" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com"
          done

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/appimage-integrator-linux-amd64 \
            dist/appimage-integrator-linux-arm64 \
            dist/Auremi-Installer-linux-amd64.tar.gz \
            dist/Auremi-Installer-linux-arm64.tar.gz \
            dist/Auremi-*.deb \
            dist/Auremi-*.rpm \
            dist/SHA256SUMS \
            dist/*.sigstore.json \
            assets/auremi-logo.png \
            --verify-tag \
            --title "Aurémi ${GITHUB_REF_NAME#v}" \
            --notes-file RELEASE_NOTES.md

  deploy-repository:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-and-release
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish signed repositories
        id: deployment
        uses: actions/deploy-pages@v4
