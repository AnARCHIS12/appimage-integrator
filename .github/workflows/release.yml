name: Release Aurémi

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: false

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes rpm

      - name: Test
        run: make test

      - name: Build installers and native packages
        run: make all

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign and verify release artifacts
        run: |
          set -eu
          identity="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${GITHUB_REF}"
          for artifact in \
            dist/appimage-integrator-linux-amd64 \
            dist/appimage-integrator-linux-arm64 \
            dist/Auremi-Installer-linux-amd64.tar.gz \
            dist/Auremi-Installer-linux-arm64.tar.gz \
            dist/Auremi-*.deb \
            dist/Auremi-*.rpm \
            dist/SHA256SUMS
          do
            cosign sign-blob "$artifact" --yes --bundle "${artifact}.sigstore.json"
            cosign verify-blob "$artifact" \
              --bundle "${artifact}.sigstore.json" \
              --certificate-identity "$identity" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com"
          done

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/appimage-integrator-linux-amd64 \
            dist/appimage-integrator-linux-arm64 \
            dist/Auremi-Installer-linux-amd64.tar.gz \
            dist/Auremi-Installer-linux-arm64.tar.gz \
            dist/Auremi-*.deb \
            dist/Auremi-*.rpm \
            dist/SHA256SUMS \
            dist/*.sigstore.json \
            assets/auremi-logo.png \
            --verify-tag \
            --title "Aurémi ${GITHUB_REF_NAME#v}" \
            --notes-file RELEASE_NOTES.md
