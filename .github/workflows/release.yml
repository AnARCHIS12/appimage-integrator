name: Release Aurémi

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes rpm

      - name: Test
        run: make test

      - name: Build installers and native packages
        run: make all

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/Auremi-Installer-linux-amd64.tar.gz \
            dist/Auremi-Installer-linux-arm64.tar.gz \
            dist/Auremi-*.deb \
            dist/Auremi-*.rpm \
            dist/SHA256SUMS \
            assets/auremi-logo.png \
            --verify-tag \
            --title "Aurémi ${GITHUB_REF_NAME#v}" \
            --notes-file RELEASE_NOTES.md
